name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          # 插件必需三个文件：main.js / manifest.json / styles.css
          # （前端静态资源已内嵌进 main.js，社区安装即可自包含运行）
          cp main.js manifest.json styles.css release/
          gh release create "$GITHUB_REF_NAME" \
            release/main.js release/manifest.json release/styles.css \
            --title "$GITHUB_REF_NAME" --generate-notes

      # 供应链签章：证明 release 附件确由本仓库源码构建（社区审核要求的安全增强）
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Post-release verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify release/main.js --repo "${{ github.repository }}"

